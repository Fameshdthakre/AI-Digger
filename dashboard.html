<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Digger Dashboard</title>
    <link rel="stylesheet" href="css/sidepanel.css">
    <style>
        :root {
            --sidebar-width: 260px;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-darker);
            color: var(--text-main);
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 32px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .data-table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 16px;
            background: var(--bg-darker);
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        tr:hover td {
            background: var(--primary-light);
        }

        .nav-item {
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .nav-item:hover {
            background: var(--bg-darker);
            color: var(--text-main);
        }

        .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
        }

        .search-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            width: 300px;
            color: var(--text-main);
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 32px;">
            <div style="width: 32px; height: 32px; background: var(--magic-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold;">AI</div>
            <h2 style="font-size: 18px; margin: 0;">AI-Digger</h2>
        </div>

        <div class="nav-item active">📊 Overview</div>
        <div class="nav-item">📋 Scrape History</div>
        <div class="nav-item">⚙️ Settings</div>
        
        <div style="margin-top: auto;">
            <button id="btn-export-all" class="btn btn-primary" style="width: 100%;">📤 Export All Data</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1 style="font-size: 28px; margin: 0;">Data Overview</h1>
                <p style="color: var(--text-muted); margin-top: 4px;">Monitor your active extraction jobs and results.</p>
            </div>
            <input type="text" class="search-bar" placeholder="Search data..." id="dashboard-search" />
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Rows</div>
                <div class="value" id="stat-total-rows">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Active Jobs</div>
                <div class="value" id="stat-active-jobs">0</div>
            </div>
            <div class="stat-card">
                <div class="label">AI Tokens Used</div>
                <div class="value" id="stat-tokens">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Success Rate</div>
                <div class="value">98.4%</div>
            </div>
        </div>

        <div class="data-table-container">
            <table id="data-table">
                <thead>
                    <tr id="table-head">
                        <th>Timestamp</th>
                        <th>Job Name</th>
                        <th>URL</th>
                        <th>Data Summary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Data rows injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="ui/dashboard-page.js"></script>
</body>
</html>
